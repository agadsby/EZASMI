        <h1>SEND</h1>
	<h2>Parameter Considerations</h2>
	<dl>
		<dt><b>NBYTE</b>
		<dd>TCP/IP for MVS 3.8 Assembler limits the NBYTE value to 1024K (1048576) bytes.
	</dl>

	<h2>Unsupported Parameters</h2>
	The following keyword parameters are not supported by TCP/IP for MVS 3.8 Assembler:
	<ul>
		<li>ALET
		<li>ECB
		<li>ERROR
		<li>FLAGS
		<li>REQAREA
	</ul>
